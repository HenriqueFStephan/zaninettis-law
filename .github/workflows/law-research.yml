name: "📚 LAW RESEARCH"

run-name: "📚 LAW RESEARCH — boletim tributário e societário"

# Monday 06:00 America/Sao_Paulo, and on demand.
# The job publishes the monitoring bulletin to /report. It does not open an issue.

on:
  schedule:
    # 09:00 UTC = 06:00 America/Sao_Paulo (Brasília), every Monday
    - cron: "0 9 * * 1"
  workflow_dispatch:
    inputs:
      date:
        description: "Report date override (YYYY-MM-DD)"
        required: false
        default: ""
      model:
        description: "Cursor model ID"
        required: false
        default: "composer-2.5"
      dry_run:
        description: "If true, print the prompt and do not call Cursor"
        required: false
        default: "false"

permissions:
  contents: write

concurrency:
  group: law-research
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Research tax and corporate law
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          REPO: ${{ github.repository }}
        run: |
          EXTRA_FLAGS=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            EXTRA_FLAGS="--dry-run"
          fi
          DATE_ARG=""
          MODEL_ARG="composer-2.5"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            DATE_ARG="${{ inputs.date }}"
            MODEL_ARG="${{ inputs.model }}"
          fi
          python scripts/run_law_research.py \
            --repo "$REPO" \
            --repo-url "https://github.com/$REPO" \
            --base-ref "${{ github.event.repository.default_branch }}" \
            --prompt-file "agents/prompts/monitoramento-juridico-regulatorio.md" \
            --report-path "frontend/src/assets/reports/latest.md" \
            --date "$DATE_ARG" \
            --model "$MODEL_ARG" \
            --output-dir "agents/output/law_research" \
            $EXTRA_FLAGS

      - name: Commit the published report
        if: github.event_name != 'workflow_dispatch' || inputs.dry_run != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/assets/reports/latest.md
          if git diff --cached --quiet; then
            echo "Report unchanged."
            exit 0
          fi
          git commit -m "chore: publish legal intelligence bulletin"
          git push origin "HEAD:${{ github.ref_name }}"
