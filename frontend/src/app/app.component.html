<ng-container *ngIf="isStudio; else site">
  <router-outlet />
</ng-container>
<ng-template #site>
  <div class="roll" *ngIf="rollout; else classic" [attr.data-layout]="design.layout()">
    <ng-container *ngFor="let tab of tabs; let i = index">
      <a *ngIf="!isOpen(tab.path)" class="shut" [routerLink]="tab.path" [ngStyle]="{ '--depth': i }">
        <app-mark [name]="tab.mark"></app-mark>
        <span class="n">{{ tab.n }}</span>
        <span>{{ tab.key | t }}</span>
      </a>
      <section *ngIf="isOpen(tab.path)" class="open">
        <div class="face">
          <app-mark [name]="tab.mark"></app-mark>
          <span class="n">{{ tab.n }}</span>
          <strong>{{ tab.key | t }}</strong>
          <em>Zaninettis</em>
          <button type="button" (click)="toggleLang()">{{ i18n.lang() === 'pt-BR' ? 'EN' : 'PT' }}</button>
        </div>
        <main>
          <router-outlet />
        </main>
      </section>
    </ng-container>
  </div>
  <ng-template #classic>
    <div class="frame" [attr.data-layout]="design.layout()">
      <app-header />
      <main>
        <router-outlet />
      </main>
      <app-footer />
    </div>
  </ng-template>
</ng-template>
