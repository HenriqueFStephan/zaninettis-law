<section class="galeria">
  <h1>{{ 'nav.updates' | t }}</h1>
  <article *ngFor="let item of items; let i = index">
    <figure class="shot"><p>{{ shot(i) | t }}</p></figure>
    <div>
      <h2>{{ item.title }}</h2>
      <p>{{ item.summary }}</p>
      <a *ngIf="item.source_url" [href]="item.source_url" target="_blank" rel="noopener">{{ item.source_name || item.source_url }}</a>
    </div>
  </article>
</section>
