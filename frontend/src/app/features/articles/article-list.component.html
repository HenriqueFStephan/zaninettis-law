<section class="galeria">
  <h1>{{ 'nav.articles' | t }}</h1>
  <a class="feature" *ngIf="posts[0]" [routerLink]="['/artigos', posts[0].slug]">
    <figure class="shot"><img [src]="photo('home.phLibrary')" [alt]="'home.phLibrary' | t" /></figure>
    <div>
      <h2>{{ posts[0].title }}</h2>
      <p>{{ posts[0].excerpt }}</p>
    </div>
  </a>
  <div class="rest">
    <a *ngFor="let post of posts.slice(1)" [routerLink]="['/artigos', post.slug]">
      <strong>{{ post.title }}</strong>
      <span>{{ post.excerpt }}</span>
    </a>
  </div>
</section>
