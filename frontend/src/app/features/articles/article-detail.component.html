<article *ngIf="post" class="galeria">
  <figure class="shot hero"><img [src]="photo('home.phPages')" [alt]="'home.phPages' | t" /></figure>
  <div class="copy">
    <a routerLink="/artigos">{{ 'nav.articles' | t }}</a>
    <h1>{{ post.title }}</h1>
    <p class="deck">{{ post.excerpt }}</p>
    <div class="body">{{ post.content_markdown }}</div>
  </div>
</article>
