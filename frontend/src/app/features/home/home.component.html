<section class="stage galeria">
  <div class="hero">
    <div class="ph hero-ph">
      <p>{{ 'home.phFacade' | t }}</p>
    </div>
    <div class="hero-copy">
      <p class="where">{{ 'footer.city' | t }}</p>
      <h1>Zaninettis</h1>
      <p class="hero-line">{{ 'home.line' | t }}</p>
    </div>
  </div>
  <div class="strip">
    <a *ngFor="let area of areas" routerLink="/atuacao">{{ area.name }}</a>
  </div>
  <div class="mosaic">
    <figure class="ph tall">
      <p>{{ 'home.phRoom' | t }}</p>
    </figure>
    <div class="mosaic-side">
      <figure class="ph short">
        <p>{{ 'home.phPages' | t }}</p>
      </figure>
      <div class="notes">
        <p class="kicker">{{ 'home.notesTitle' | t }}</p>
        <p>{{ 'home.note1' | t }}</p>
        <p>{{ 'home.note2' | t }}</p>
        <p>{{ 'home.note3' | t }}</p>
      </div>
    </div>
  </div>
</section>
