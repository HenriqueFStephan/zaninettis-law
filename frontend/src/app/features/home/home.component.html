<section class="stage galeria">
  <div class="hero">
    <div class="ph hero-ph">
      <img [src]="photo('home.phFacade')" [alt]="'home.phFacade' | t" />
    </div>
    <div class="hero-copy">
      <p class="where">{{ 'footer.city' | t }}</p>
      <h1>{{ 'home.signature' | t }}</h1>
      <p class="hero-line">{{ 'home.line' | t }}</p>
    </div>
  </div>
  <div class="strip">
    <a *ngFor="let area of areas" routerLink="/atuacao">{{ area.key | t }}</a>
  </div>
  <div class="mosaic">
    <figure class="ph tall">
      <img [src]="photo('home.phRoom')" [alt]="'home.phRoom' | t" />
    </figure>
    <div class="mosaic-side">
      <figure class="ph short">
        <img [src]="photo('home.phPages')" [alt]="'home.phPages' | t" />
      </figure>
      <div class="notes">
        <p class="kicker">{{ 'home.notesTitle' | t }}</p>
        <p>{{ 'home.note1' | t }}</p>
        <p>{{ 'home.note2' | t }}</p>
        <p>{{ 'home.note3' | t }}</p>
      </div>
    </div>
  </div>
</section>
